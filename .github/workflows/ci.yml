# Integración continua: compila el backend y ejecuta todos los tests
# en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Los tests de integración usan Testcontainers; los runners de GitHub ya traen Docker.
      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      # Incluye la revisión de tipos de TypeScript (tsc -b)
      - name: Compilar
        run: npm run build
