spring.application.name=inventario

# --- Base de datos ---
# Valores por defecto para desarrollo local (docker compose, puerto 5433).
# En producción se sobrescriben con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventario}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario}

# --- JPA / Hibernate ---
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration);
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Negocio ---
# Zona horaria para calcular "hoy" (qué lotes están vencidos)
app.zona-horaria=America/Lima

# --- Subida de archivos (importación de inventario) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Seguridad ---
# Clave secreta con la que se firma la cookie "recordarme" (30 días).
# En producción se define con la variable de entorno APP_CLAVE_RECORDAR (una frase larga y aleatoria).
app.seguridad.clave-recordar=${APP_CLAVE_RECORDAR:solo-para-desarrollo-no-usar-en-produccion}
# Si se define, se exige para crear la primera cuenta (evita que alguien se adelante al publicar la app).
app.seguridad.codigo-configuracion=${APP_CODIGO_CONFIGURACION:}
# La sesión normal dura 12 horas sin uso; con "recordarme", la cookie la renueva por 30 días
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Swagger envía el token CSRF al probar operaciones que cambian datos
springdoc.swagger-ui.csrf.enabled=true
