# =====================================================================
# Perfil de producción (Render + Neon). Se activa con SPRING_PROFILES_ACTIVE=prod
# (lo hace el Dockerfile). Los datos de conexión llegan por variables de entorno:
#   DB_URL, DB_USER, DB_PASSWORD, APP_CLAVE_RECORDAR y (opcional) APP_CODIGO_CONFIGURACION.
# =====================================================================

# Render indica el puerto en la variable PORT
server.port=${PORT:8080}

# Render atiende HTTPS y reenvía a la app por HTTP: con esto la app sabe que la conexión original era segura
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Sin valor por defecto: si falta la variable, la app no arranca (mejor que firmar con una clave conocida)
app.seguridad.clave-recordar=${APP_CLAVE_RECORDAR}

# --- Conexiones a la base de datos ---
# La base gratuita de Neon "duerme" cuando no tiene conexiones activas y solo gasta horas de cómputo
# mientras está despierta. Por eso no se mantienen conexiones abiertas sin uso: se cierran al minuto.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=600000
# Al despertar, la base puede tardar unos segundos en aceptar la primera conexión
spring.datasource.hikari.connection-timeout=30000

# El manifiesto de la app instalable (PWA) con su tipo correcto
server.mime-mappings.webmanifest=application/manifest+json
